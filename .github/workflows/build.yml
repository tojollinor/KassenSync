name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate approved branding icons
        shell: pwsh
        run: .\\tools\\Generate-OrdnerSyncIcon.ps1

      - name: Verify branding assets
        shell: pwsh
        run: |
          $logo = 'src/KassenSync.App/Assets/OrdnerSyncLogoFull.png'
          $iconPng = 'src/KassenSync.App/Assets/OrdnerSyncIcon.png'
          $ico = 'src/KassenSync.App/Assets/OrdnerSync.ico'

          foreach ($file in @($logo, $iconPng, $ico)) {
            if (-not (Test-Path $file)) { throw "Branding asset missing: $file" }
          }

          $pngSig = [byte[]](0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A)
          foreach ($png in @($logo, $iconPng)) {
            $bytes = [IO.File]::ReadAllBytes($png)
            for ($i = 0; $i -lt 8; $i++) {
              if ($bytes[$i] -ne $pngSig[$i]) { throw "Invalid PNG signature: $png" }
            }
          }

          $icoBytes = [IO.File]::ReadAllBytes($ico)
          if ($icoBytes[0] -ne 0 -or $icoBytes[1] -ne 0 -or $icoBytes[2] -ne 1 -or $icoBytes[3] -ne 0) {
            throw "Invalid ICO signature."
          }
          $frameCount = [BitConverter]::ToUInt16($icoBytes, 4)
          if ($frameCount -lt 7) { throw "ICO does not contain the expected icon sizes." }

      - name: Restore
        run: dotnet restore OrdnerSync.sln

      - name: Build
        run: dotnet build OrdnerSync.sln -c Release --no-restore
