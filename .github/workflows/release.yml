name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            [xml]$props = Get-Content 'Directory.Build.props'
            $version = [string]$props.Project.PropertyGroup.Version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Ungültige Version: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore OrdnerSync.sln

      - name: Build
        shell: pwsh
        run: dotnet build OrdnerSync.sln -c Release -p:Version=$env:VERSION

      - name: Publish WPF app
        shell: pwsh
        run: |
          dotnet publish src/KassenSync.App/KassenSync.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/app

      - name: Publish service
        shell: pwsh
        run: |
          dotnet publish src/KassenSync.Service/KassenSync.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:VERSION `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/publish/service

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:VERSION" 'installer\OrdnerSync.iss'

      - name: Create checksum
        shell: pwsh
        run: |
          $setup = 'artifacts/installer/OrdnerSync-Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OrdnerSync-Setup.exe" | Set-Content 'artifacts/installer/OrdnerSync-Setup.exe.sha256' -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrdnerSync-${{ env.VERSION }}
          path: |
            artifacts/installer/OrdnerSync-Setup.exe
            artifacts/installer/OrdnerSync-Setup.exe.sha256

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "OrdnerSync $env:VERSION" --generate-notes
          }
          gh release upload $tag `
            'artifacts/installer/OrdnerSync-Setup.exe' `
            'artifacts/installer/OrdnerSync-Setup.exe.sha256' `
            --clobber

